# PostgreSQL for local development and tests.
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: leads_demo
    ports:
      - "5432:5432"
    volumes:
      - leads_demo_pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d leads_demo"]
      interval: 5s
      retries: 10

volumes:
  leads_demo_pgdata:
